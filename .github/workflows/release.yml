name: release
on:
  push:
    tags:
      - "v*.*.*"
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror data review gate
        run: |
          set -euo pipefail
          if git grep -n 'verified=pending' -- data/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            printf 'FAIL: mirror data has verified=pending entries; manual review required before release\n' >&2
            exit 1
          fi
          printf 'mirror data: no pending entries\n'
      - name: Build tarball and checksums
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          test -f VERSION
          git archive --format=tar.gz --prefix="srv-tune-${TAG}/" -o "srv-tune-${TAG}.tar.gz" "${TAG}"
          (cd "$(pwd)" && sha256sum "srv-tune-${TAG}.tar.gz" > sha256sums.txt)
          cat sha256sums.txt
          test -s "srv-tune-${TAG}.tar.gz"
      - name: Create DRAFT release with assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" --draft --title "srv-tune ${TAG}" \
            --notes "Draft release. Verify sha256sums.txt, then publish. Install: ./install.sh --tag ${TAG} --sha256 <sum> --yes" \
            "srv-tune-${TAG}.tar.gz" sha256sums.txt
