name: release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the tarball and checksums only; never create or publish a release'
        required: false
        default: true
        type: boolean
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mirror data review gate
        # Real releases only: tag pushes. Dry runs skip the gate so the
        # build path itself can be tested while entries are still pending.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          if git grep -n 'verified=pending' -- data/ | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            printf 'FAIL: mirror data has verified=pending entries; manual review required before release\n' >&2
            exit 1
          fi
          printf 'mirror data: no pending entries\n'
      - name: Version file matches the tag
        # First bumped for v0.3.0; keep VERSION in lockstep with tags.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          want="${GITHUB_REF_NAME#v}"
          have="$(cat VERSION)"
          if [[ "$have" != "$want" ]]; then
            printf 'FAIL: VERSION file says %s but the tag is %s\n' "$have" "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          printf 'version: VERSION matches tag %s\n' "$GITHUB_REF_NAME"
      - name: Build tarball and checksums
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            TREE="${TAG}"
          else
            TAG="dry-run-$(echo "${GITHUB_SHA}" | cut -c1-8)"
            TREE="HEAD"
          fi
          test -f VERSION
          git archive --format=tar.gz --prefix="temper-${TAG}/" -o "temper-${TAG}.tar.gz" "${TREE}"
          (cd "$(pwd)" && sha256sum "temper-${TAG}.tar.gz" > sha256sums.txt)
          cat sha256sums.txt
          test -s "temper-${TAG}.tar.gz"
      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: temper-dry-run
          path: |
            temper-dry-run-*.tar.gz
            sha256sums.txt
      - name: Create DRAFT release with assets
        # Real releases only: never runs on workflow_dispatch.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" --draft --title "temper ${TAG}" \
            --notes "Draft release. Verify sha256sums.txt, then publish. Install: ./install.sh --tag ${TAG} --sha256 <sum> --yes" \
            "temper-${TAG}.tar.gz" sha256sums.txt
