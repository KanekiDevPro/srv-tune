name: ci
on: [push, pull_request]
env:
  # Pinned to the versions verified locally. Install from upstream releases
  # (apt versions drift); each step asserts the version before use.
  SHELLCHECK_VER: 0.10.0
  SHFMT_VER: 3.12.0
  BATS_VER: 1.11.1
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: CRLF and exec-bit gate
        run: bash tests/hygiene.sh
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned tools
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/srv-tools"
          mkdir -p "$T"
          cd "$T"
          curl -sSL --max-time 120 -o sc.tar.xz "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VER}/shellcheck-v${SHELLCHECK_VER}.linux.x86_64.tar.xz"
          tar xf sc.tar.xz
          curl -sSL --max-time 120 -o shfmt "https://github.com/mvdan/sh/releases/download/v${SHFMT_VER}/shfmt_v${SHFMT_VER}_linux_amd64"
          chmod +x shfmt
          curl -sSL --max-time 120 -o bats.tgz "https://github.com/bats-core/bats-core/archive/refs/tags/v${BATS_VER}.tar.gz"
          tar xzf bats.tgz
          test "$(./shellcheck-v${SHELLCHECK_VER}/shellcheck --version | grep -o '[0-9.]*' | head -n 1)" = "$SHELLCHECK_VER"
          test "$(./shfmt --version)" = "v${SHFMT_VER}"
          test "$(./bats-core-${BATS_VER}/bin/bats --version)" = "Bats ${BATS_VER}"
          echo "$T/shellcheck-v${SHELLCHECK_VER}:$T" >>"$GITHUB_PATH"
      - name: ShellCheck
        run: shellcheck -S warning optimizer.sh lib/*.sh lib/i18n/*.sh modules/*.sh scanner/scan.sh scanner/report.sh scanner/collectors/*.sh tests/*.sh tests/*.bash tests/*.bats tests/vm/*.sh
      - name: shfmt
        run: shfmt -d -i 2 optimizer.sh lib modules scanner tests
      - name: bats
        run: '"$RUNNER_TEMP/srv-tools/bats-core-${BATS_VER}/bin/bats" --print-output-on-failure tests/'
      - name: TEMPORARY-DEBUG bogus-only trace (revert once root-caused)
        if: failure()
        run: |
          export SRV_TUNE_TEST=1 SRV_TUNE_STATE_DIR="$RUNNER_TEMP/dbg-state" SRV_TUNE_LOCK_FILE="$RUNNER_TEMP/dbg-state/lock" OS_RELEASE_FILE=/etc/os-release
          mkdir -p "$SRV_TUNE_STATE_DIR/backups"
          ls -lad "$RUNNER_TEMP/dbg-state" "$RUNNER_TEMP"
          touch "$RUNNER_TEMP/dbg-state/probe" && echo TOUCH-OK || echo TOUCH-FAIL
          command -v flock; flock --version | head -n 1
          bash -c 'exec 9>"$1"; echo EXEC9-OK' bash "$RUNNER_TEMP/dbg-state/lock" || echo EXEC9-FAIL
          echo "=== TEST-84 repro ==="
          SRV_TUNE_TEST=1 SRV_TUNE_LOCK_FILE=/nonexistent-dir-xyz-123/lock bash -x -c 'source lib/lock.sh; lock_acquire && lock_release && echo FALLBACK-OK; echo "REPRO-RC=$?"'
          echo "=== bogus trace ==="
          bash -x optimizer.sh apply --profile generic --only bogus --yes; echo "TRACE-RC=$?"
  scan-matrix:
    strategy:
      matrix:
        # Pinned tags. If ubuntu:26.04 is not yet published on Docker Hub the
        # job fails visibly; fallback: temporarily replace with ubuntu:devel
        # in a PR and note it in docs/doc-verify-p2a.md (do NOT silently drop
        # the 26.04 leg: uutils/sudo-rs verification lives there).
        # `tag` mirrors `image` with filesystem-safe chars (artifact names).
        include:
          - image: ubuntu:22.04
            tag: ubuntu-22.04
          - image: ubuntu:24.04
            tag: ubuntu-24.04
          - image: ubuntu:26.04
            tag: ubuntu-26.04
          - image: debian:12
            tag: debian-12
          - image: debian:13
            tag: debian-13
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          (apt-get update -qq && apt-get install -y -qq bash curl iproute2 procps bats sudo systemd openssh-server python3 2>/dev/null) || true
      - name: Record uutils/sudo-rs flavors (26.04 gate)
        run: |
          (ls --version 2>/dev/null | head -n 1 || echo "no-ls-version") | tee toolchain.txt
          (sudo --version 2>/dev/null | head -n 1 || echo "no-sudo") | tee -a toolchain.txt
          cat toolchain.txt
      - name: Scanner as root and non-root, next to manual commands
        run: bash tests/vm/capture-scan.sh artifacts
      - name: Assert scan quality (no false unknown on real Linux)
        run: bash tests/vm/assert-scan.sh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: scan-${{ matrix.tag }}
          path: |
            artifacts/
            toolchain.txt
  integration:
    # REAL systemd (GitHub runners boot with systemd as PID 1): ssh-guard
    # with actual systemd-run timers, temp files only, never the runner's
    # sshd/network config.
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install integration deps (binaries only, nothing enabled)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openssh-server iproute2 nftables ufw
      - name: Guard integration with real systemd-run
        run: sudo bash tests/vm/guard-systemd.sh
      - name: P3b integration (real sshd/nft, temp files and port 22222 only)
        run: sudo bash tests/vm/p3b-systemd.sh
  uutils-check:
    # Resolves the P2a "half-verified" item empirically on 26.04.
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:26.04
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          (apt-get update -qq && apt-get install -y -qq bash curl bats sudo 2>/dev/null) || true
      - name: Toolchain flavors
        run: |
          echo "--- coreutils flavor ---"
          ls --version | head -n 1
          echo "--- sudo flavor ---"
          sudo --version | head -n 1
          echo "--- grep/sed/awk sanity ---"
          printf 'a=1\n' | grep -E '^a=' | cut -d= -f2
      - name: Full bats suite on uutils coreutils
        run: bats tests/
      - name: Scanner smoke on 26.04
        run: bash scanner/scan.sh --recommend-only
